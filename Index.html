<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>Stella AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

    <!-- Welcome -->
    <section id="welcomeScreen" class="screen">

        <div class="stella-avatar">S</div>

        <h1>Stella</h1>

        <p class="welcome-text">
            أهو أنت جيت أخيرًا.
        </p>

        <p class="welcome-subtitle">
            تعالى نتكلم شوية.
        </p>

        <button id="startButton">
            ادخل عند Stella
        </button>

    </section>


    <!-- Chat -->
    <section id="chatScreen" class="screen hidden">

        <header class="topbar">

            <div class="stella-info">

                <div class="mini-avatar">S</div>

                <div class="stella-details">
                    <strong>Stella</strong>
                    <span id="status">متاحة للكلام</span>
                </div>

            </div>

            <button id="clearChatButton">
                مسح
            </button>

        </header>


        <main id="messages"></main>


        <div id="typingIndicator" class="typing hidden">
            Stella بتفكر...
        </div>


        <footer class="composer">

            <button
                id="voiceButton"
                class="icon-button"
                type="button">
                🎤
            </button>

            <textarea
                id="messageInput"
                rows="1"
                placeholder="اكتب لـ Stella...">
            </textarea>

            <button
                id="sendButton"
                class="send-button"
                type="button">
                ➤
            </button>

        </footer>

    </section>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>
<script src="app.js"></script>

</body>
</html>
